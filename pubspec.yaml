name: intl_date_picker
description: An internationalized date and date range picker for Flutter supporting Gregorian and Jalali (Solar Hijri) calendars with English and Persian localizations.
version: 1.0.0
homepage: https://github.com/mohsenzahab/intl_date_picker
repository: https://github.com/mohsenzahab/intl_date_picker
issue_tracker: https://github.com/mohsenzahab/intl_date_picker/issues
topics:
  - datepicker
  - jalali
  - shamsi
  - calendar

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  shamsi_date: ^1.0.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
